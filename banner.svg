<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a8a8a"/>
      <stop offset="25%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#8a8a8a"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#3a3a3a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="220" fill="#0a0a0a"/>
  <rect width="800" height="220" fill="url(#glow)"/>
  <g stroke="#1e1e1e" stroke-width="1">
    <line x1="0" y1="55" x2="800" y2="55"/>
    <line x1="0" y1="110" x2="800" y2="110"/>
    <line x1="0" y1="165" x2="800" y2="165"/>
    <line x1="200" y1="0" x2="200" y2="220"/>
    <line x1="400" y1="0" x2="400" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
  </g>
  <circle r="2.5" fill="#c0c0c0">
    <animateMotion dur="6s" repeatCount="indefinite" path="M0,55 L800,55"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#888888">
    <animateMotion dur="8s" repeatCount="indefinite" path="M800,165 L0,165"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="100" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="52" font-weight="bold" letter-spacing="8" fill="url(#silver)">SUNNY TIWARI</text>
  <text x="400" y="145" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#a8a8a8" letter-spacing="3">
    developer &#183; video editor &#183; KREATION
    <animate attributeName="opacity" values="1;1;0.35;1;1" keyTimes="0;0.85;0.9;0.95;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <g stroke="#c0c0c0" stroke-width="1.5" opacity="0.7">
    <line x1="250" y1="170" x2="380" y2="170">
      <animate attributeName="x1" values="250;230;250" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="420" y1="170" x2="550" y2="170">
      <animate attributeName="x2" values="550;570;550" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>
  <text x="400" y="176" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#c0c0c0">&#9670;</text>
</svg>
